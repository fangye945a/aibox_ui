<html class="noVNC_connected" lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenHarmony 模拟桌面</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: #dfeaf6; color: #263c53; font: 14px system-ui, sans-serif; }
        header, footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 20px; background: #20364b; color: #f4f8fc; }
        main { width: min(100%, 560px); padding: 24px 16px; margin: auto; }
        img { width: 92px; height: 68px; margin: 0 auto 16px; display: block; object-fit: contain; }
        details { margin-bottom: 10px; background: #fff; border: 1px solid #b8cbe0; border-radius: 6px; }
        summary { cursor: pointer; padding: 12px 16px; font-weight: 600; }
        dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 0; padding: 0 16px 16px; }
        dd { margin: 0; overflow-wrap: anywhere; }
        pre { margin: 0 16px 16px; padding: 12px; background: #182732; color: #a7e1bd; border-radius: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
        small { color: #c6d5e5; }
    </style>
</head>
<body>
    <header><strong>OpenHarmony 6.1</strong><span>模拟桌面</span></header>
    <main>
        <img src="./ct23.png" alt="在鸿工控机 CT23">
        <details open>
            <summary>系统信息</summary>
            <dl>
                <dt>设备名称</dt><dd>在鸿工控机 CT23</dd>
                <dt>设备编号</dt><dd>DEMO-CT23-0001</dd>
                <dt>网络地址</dt><dd>192.0.2.23</dd>
            </dl>
        </details>
        <details>
            <summary>终端快照</summary>
            <pre>demo@ct23:~$ uname -s
OpenHarmony
demo@ct23:~$ ip -brief address
eth0    UP    192.0.2.23/24</pre>
        </details>
    </main>
    <footer><span>CT23</span><small>VNC 演示会话</small></footer>
</body>
</html>
