name: Deploy to GitHub Pages

# 只在 main/master 分支推送时自动部署
on:
  push:
    branches: [main, master]
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# GITHUB_TOKEN 需要这些权限才能发布 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免并发写坏产物
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zaiohdeviceworkspace/package-lock.json

      - name: Build AIBox console at Pages root
        run: npm run build:workspace-demo

      - name: Check AIBox console source
        run: npm --prefix zaiohdeviceworkspace run typecheck

      - name: Disable Jekyll
        # 下划线开头的文件默认被 Jekyll 忽略，加此文件跳过处理
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 关键：仓库若尚未创建 Pages 站点，GET /repos/{owner}/{repo}/pages 会返回 404，
          # configure-pages 默认就报 "Get Pages site failed" 而中断。
          # enablement: true 会改为调用 POST 接口自动创建站点（build_type=workflow），
          # 从而无需在网页设置里手动开启。需要下方 jobs.build 具备 pages: write 权限。
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
